<html lang="fr">
<head>
<meta charset="utf-8">

<title>Cap emploi</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: grid; place-items: center; background: #f6f8f6; color: #1f2a24; font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; padding: 16px; }
  form { width: 100%; max-width: 360px; background: #fff; border: 1px solid #dde6e0; border-radius: 20px; padding: 28px 24px; display: grid; gap: 14px; box-shadow: 0 20px 50px -30px rgba(31,42,36,.4); }
  .brand { font-weight: 800; font-size: 22px; color: #2f5241; margin-bottom: 4px; }
  label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #5b6660; }
  input[type=password] { width: 100%; font: inherit; color: inherit; background: #f6f8f6; border: 1px solid #dde6e0; border-radius: 12px; padding: 12px 14px; }
  input[type=password]:focus { outline: none; border-color: #2f5241; }
  .remember { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 500; letter-spacing: 0; text-transform: none; }
  button { font: 700 15px inherit; font-family: inherit; color: #fff; background: #2f5241; border: 0; border-radius: 12px; padding: 12px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  button:focus-visible, input:focus-visible { outline: 2px solid #4f7a63; outline-offset: 2px; }
  .err { color: #b3261e; font-size: 14px; min-height: 1.4em; margin: 0; }
  @media (prefers-color-scheme: dark) {
    body { background: #121815; color: #e5ece8; }
    form { background: #1a221e; border-color: #2c3832; }
    .brand { color: #8cc0a3; }
    label { color: #9fb0a7; }
    input[type=password] { background: #121815; border-color: #2c3832; }
    .err { color: #f0566a; }
  }
</style>
</head>
<body>
<form id="f">
  <div class="brand">Cap emploi</div>
  <label for="pw">Mot de passe</label>
  <input type="password" id="pw" autocomplete="current-password" autofocus required>
  <label class="remember"><input type="checkbox" id="rem" checked> Se souvenir de cet appareil</label>
  <button id="go" type="submit">Entrer</button>
  <p class="err" id="err" role="alert"></p>
</form>

const un64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY_STORE = "cap-emploi-key-" + SALT.slice(0, 8);
// « Se souvenir » garde une CryptoKey non exportable dans IndexedDB : elle ne peut pas être copiée hors du navigateur,
// mais une autre page de snoog43.github.io (même origine) peut encore s'en servir pour déchiffrer sur cet appareil.
// Pour une vraie isolation : domaine dédié, ou décocher « Se souvenir ».
function idb(mode, fn) {
  return new Promise((ok, ko) => {
    const req = indexedDB.open("cap-emploi", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("keys");
    req.onerror = () => ko(req.error);
    req.onsuccess = () => {
      const tx = req.result.transaction("keys", mode), r = fn(tx.objectStore("keys"));
      tx.oncomplete = () => ok(r && r.result); tx.onerror = () => ko(tx.error);
    };
  });
}
const loadKey = () => idb("readonly", s => s.get(KEY_STORE));
const saveKey = key => idb("readwrite", s => s.put(key, KEY_STORE));
const forgetKey = () => idb("readwrite", s => s.delete(KEY_STORE));
async function unlock(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: un64(IV) }, key, un64(DATA));
  return new TextDecoder().decode(plain);
}
// Le site ne remplace la page qu'une fois celle-ci entièrement chargée (sinon il s'ajoute en dessous)
const loaded = () => new Promise(r => document.readyState === "complete" ? r() : window.addEventListener("load", () => r(), { once: true }));
async function show(html) { await loaded(); document.open(); document.write(html); document.close(); }
async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: un64(SALT), iterations: ITER, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
(async () => {
  try { localStorage.removeItem(KEY_STORE); } catch (e) {} // ancienne version : clé brute en localStorage
  let saved = null;
  try { saved = await loadKey(); } catch (e) {}
  if (saved) {
    const f = document.getElementById("f"); f.style.visibility = "hidden";
    try { await show(await unlock(saved)); return; }
    catch (e) { try { await forgetKey(); } catch (e2) {} f.style.visibility = ""; }
  }
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Ouverture…"; err.textContent = "";
  try {
    const key = await derive(document.getElementById("pw").value);
    const html = await unlock(key);
    if (document.getElementById("rem").checked) {
      try { await saveKey(key); } catch (e2) {}
    }
    await show(html);
  } catch (x) {
    btn.disabled = false; btn.textContent = "Entrer";
    err.textContent = "Mot de passe incorrect.";
  }
});
})();
